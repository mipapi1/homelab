<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Secrets: Vault on its own VM holds every secret; External Secrets, Ansible and Terraform read them at run time; nothing is in git">
<title>Secrets: Vault on its own VM holds every secret; External Secrets, Ansible and Terraform read them at run time; nothing is in git</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<rect width="960" height="470" rx="14" fill="#ffffff"/>
<text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">VAULT</text>
<text x="318" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">PATHS (KV V2)</text>
<text x="662" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">WHO READS THEM</text>
<rect x="24" y="52" width="250" height="320" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="1"/>
<text x="42" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" font-weight="600">HashiCorp Vault</text>
<text x="42" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">its own VM, outside the cluster</text>
<rect x="38" y="114" width="222" height="53" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="137" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="600">Raft storage</text>
<text x="54" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">integrated, no extra database</text>
<rect x="38" y="177" width="222" height="53" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="600">TLS + audit log</text>
<text x="54" y="218" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">every request recorded</text>
<rect x="38" y="240" width="222" height="53" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="600">Nightly snapshots</text>
<text x="54" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">plus the VM is replicated</text>
<rect x="38" y="303" width="222" height="53" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="54" y="326" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1f2328" font-weight="600">Unseal: 3 of 5 keys</text>
<text x="54" y="344" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">kept offline, never in git</text>
<rect x="318" y="52" width="300" height="196" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="334" y="76" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1f2328" font-weight="600">secret/k8s/&lt;app&gt;</text>
<text x="334" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">one folder per app</text>
<rect x="334" y="108" width="60" height="22" rx="11" fill="#fff8c5"/>
<text x="364" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">actual</text>
<rect x="400" y="108" width="60" height="22" rx="11" fill="#fff8c5"/>
<text x="430" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">argocd</text>
<rect x="466" y="108" width="74" height="22" rx="11" fill="#fff8c5"/>
<text x="503" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">authelia</text>
<rect x="546" y="108" width="46" height="22" rx="11" fill="#fff8c5"/>
<text x="569" y="123" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">ente</text>
<rect x="334" y="138" width="88" height="22" rx="11" fill="#fff8c5"/>
<text x="378" y="153" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">ente-admin</text>
<rect x="428" y="138" width="67" height="22" rx="11" fill="#fff8c5"/>
<text x="462" y="153" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">forgejo</text>
<rect x="501" y="138" width="74" height="22" rx="11" fill="#fff8c5"/>
<text x="538" y="153" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">headlamp</text>
<rect x="334" y="168" width="74" height="22" rx="11" fill="#fff8c5"/>
<text x="371" y="183" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">homepage</text>
<rect x="414" y="168" width="53" height="22" rx="11" fill="#fff8c5"/>
<text x="440" y="183" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">media</text>
<rect x="473" y="168" width="74" height="22" rx="11" fill="#fff8c5"/>
<text x="510" y="183" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">renovate</text>
<rect x="334" y="198" width="60" height="22" rx="11" fill="#fff8c5"/>
<text x="364" y="213" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="11.5" fill="#9a6700" text-anchor="middle">uptime</text>
<rect x="318" y="262" width="300" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="334" y="285" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1f2328" font-weight="600">secret/k3s/cluster</text>
<text x="602" y="285" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76" text-anchor="end">cluster join token</text>
<rect x="318" y="322" width="300" height="50" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="334" y="345" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace" font-size="13.5" fill="#1f2328" font-weight="600">secret/proxmox/terraform</text>
<text x="602" y="345" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76" text-anchor="end">API token</text>
<rect x="662" y="52" width="274" height="152" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="662" y="64" width="3" height="128" rx="1.5" fill="#0969da"/>
<text x="678" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">External Secrets</text>
<text x="678" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">logs in with Kubernetes auth:</text>
<text x="678" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">no Vault token stored in the cluster</text>
<text x="678" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">read-only, and only on k8s/*</text>
<text x="678" y="141" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">29 secrets in 16 namespaces,</text>
<text x="678" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">refreshed into k8s Secrets hourly</text>
<rect x="662" y="236" width="274" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="662" y="248" width="3" height="36" rx="1.5" fill="#0969da"/>
<text x="678" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Ansible</text>
<text x="678" y="277" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">looks secrets up at run time</text>
<rect x="662" y="312" width="274" height="60" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="662" y="324" width="3" height="36" rx="1.5" fill="#0969da"/>
<text x="678" y="335" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Terraform</text>
<text x="678" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">gets its token from a wrapper script</text>
<path d="M618,150 L662,150" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M618,287 L662,266" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M618,347 L662,342" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M274,150 L318,150" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="480" y="408" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1f2328" font-weight="600" text-anchor="middle">No secret is committed to any repo, public or private.</text>
<text x="480" y="428" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="middle">New values go straight into Vault; apps restart when a credential&#x27;s revision annotation changes.</text>
</svg>
