<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-label="Network: devices reach the lab over WireGuard through OPNsense, which filters per device group, load-balances with HAProxy and answers DNS; servers, storage and home are separate networks">
<title>Network: devices reach the lab over WireGuard through OPNsense, which filters per device group, load-balances with HAProxy and answers DNS; servers, storage and home are separate networks</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#656d76"/></marker></defs>
<rect width="960" height="470" rx="14" fill="#ffffff"/>
<text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">WHO CONNECTS</text>
<text x="314" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">FIREWALL</text>
<text x="718" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-weight="600" letter-spacing="1.4">NETWORKS</text>
<rect x="24" y="52" width="230" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="24" y="64" width="3" height="50" rx="1.5" fill="#bc4c00"/>
<text x="40" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">My devices</text>
<text x="40" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">WireGuard, split tunnel</text>
<text x="40" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">full access</text>
<rect x="24" y="190" width="230" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="24" y="202" width="3" height="50" rx="1.5" fill="#bc4c00"/>
<text x="40" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Family devices</text>
<text x="40" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">WireGuard, HTTPS + DNS only</text>
<text x="40" y="247" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">everything else blocked + logged</text>
<rect x="24" y="328" width="230" height="74" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="40" y="351" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">The internet</text>
<text x="40" y="369" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">only WireGuard and Plex</text>
<text x="40" y="385" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">are open from outside</text>
<rect x="314" y="52" width="340" height="350" rx="12" fill="#fff1e5" stroke="#bc4c00" stroke-width="1"/>
<text x="332" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" font-weight="600">OPNsense</text>
<text x="636" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76" text-anchor="end">router + firewall</text>
<rect x="328" y="92" width="312" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="344" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">WireGuard</text>
<text x="344" y="133" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">one tunnel, rules per device group</text>
<rect x="328" y="166" width="312" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="344" y="189" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Firewall rules</text>
<text x="344" y="207" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">each network kept apart</text>
<rect x="328" y="240" width="312" height="78" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="344" y="263" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">HAProxy</text>
<text x="344" y="281" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">one virtual IP: k3s API on all 3 nodes,</text>
<text x="344" y="297" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">HTTPS ingress, Vault, Plex</text>
<rect x="328" y="330" width="312" height="62" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="344" y="353" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">DNS</text>
<text x="344" y="371" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">AdGuard filters, Unbound names the lab</text>
<rect x="718" y="52" width="218" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="718" y="64" width="3" height="58" rx="1.5" fill="#1b7c83"/>
<text x="734" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Servers</text>
<text x="734" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">3 Proxmox hosts</text>
<text x="734" y="109" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">k3s VMs + the Vault VM</text>
<rect x="718" y="186" width="218" height="82" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="718" y="198" width="3" height="58" rx="1.5" fill="#9a6700"/>
<text x="734" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Storage</text>
<text x="734" y="227" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">NAS: NFS for photos,</text>
<text x="734" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">media and backups</text>
<rect x="718" y="320" width="218" height="66" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="734" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Home</text>
<text x="734" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">everyday devices</text>
<path d="M254,89 L284,89 L284,123 L328,123" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M254,227 L284,227 L284,123 L328,123" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M254,365 L284,365 L284,279 L328,279" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="258" y="381" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" font-style="italic">Plex</text>
<path d="M640,279 L686,279 L686,93 L718,93" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M827,134 L827,186" fill="none" stroke="#656d76" stroke-width="1.5" marker-end="url(#a)"/>
<text x="827" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-style="italic">NFS, through the firewall</text>
<text x="480" y="444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="middle">Every web UI is behind Authelia sign-in with 2FA, even inside the tunnel.</text>
</svg>
