<rect x="234" y="320" width="210" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<text x="250" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">GitHub</text>
<text x="250" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">push mirror of public repos</text>
