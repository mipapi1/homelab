<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Getting changes in: push to Forgejo, Argo CD syncs the cluster; Renovate proposes image updates that are mirrored first; Ansible installs the platform; GitHub gets a mirror">
