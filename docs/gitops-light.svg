<rect x="734" y="180" width="3" height="68" rx="1.5" fill="#1b7c83"/>
<text x="750" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" fill="#1f2328" font-weight="600">k3s</text>
