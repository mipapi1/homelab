<text x="480" y="422" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#656d76" text-anchor="middle">Every change is a commit, so every change can be reviewed and reverted.</text>
