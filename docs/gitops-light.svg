<text x="368" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="middle" font-style="italic">mirror</text>
<rect x="484" y="320" width="452" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
<rect x="484" y="332" width="3" height="46" rx="1.5" fill="#0969da"/>
<text x="500" y="343" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1f2328" font-weight="600">Ansible</text>
<text x="500" y="361" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#656d76">installs k3s + the platform: --check --diff first,</text>
